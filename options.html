<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dzc's translator Settings</title>
  <style>
    :root {
      --bg: #f6f3ec;
      --ink: #151515;
      --muted: #716b61;
      --line: rgba(21, 21, 21, 0.14);
      --panel: rgba(255, 255, 255, 0.78);
      --dark: #151515;
      --green: #427a48;
      --red: #b83f2e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family:
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--bg);
    }

    main {
      width: min(760px, calc(100vw - 32px));
      margin: 44px auto;
    }

    header {
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .panel {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field.full {
      grid-column: span 2;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      outline: none;
    }

    input,
    select {
      height: 42px;
      padding: 0 11px;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
      padding: 10px 11px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    button {
      height: 42px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      background: var(--dark);
      font-size: 13px;
      font-weight: 800;
    }

    .ghost {
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
    }

    .status {
      min-height: 20px;
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
    }

    .status.error {
      color: var(--red);
    }

    .hint {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>翻译接口设置</h1>
      <p>默认使用 MyMemory 免费接口。开启大模型后，扩展会调用兼容 OpenAI Chat Completions 的接口。</p>
    </header>

    <section class="panel">
      <div class="grid">
        <div class="field full">
          <label for="provider">翻译供应商</label>
          <select id="provider">
            <option value="mymemory">MyMemory 免费接口</option>
            <option value="openai-compatible">OpenAI-compatible 大模型接口</option>
          </select>
        </div>

        <div class="field full model-field">
          <label for="apiBaseUrl">API Base URL</label>
          <input id="apiBaseUrl" type="url" placeholder="https://api.openai.com/v1" />
          <div class="hint">示例：OpenAI 填 https://api.openai.com/v1，DeepSeek 填 https://api.deepseek.com/v1。</div>
        </div>

        <div class="field model-field">
          <label for="apiMode">接口类型</label>
          <select id="apiMode">
            <option value="chat-completions">Chat Completions</option>
            <option value="responses">Responses API</option>
          </select>
        </div>

        <div class="field model-field">
          <label for="apiKey">API Key</label>
          <input id="apiKey" type="password" autocomplete="off" placeholder="sk-..." />
        </div>

        <div class="field model-field">
          <label for="model">模型名</label>
          <input id="model" type="text" placeholder="gpt-4o-mini" />
        </div>

        <div class="field model-field">
          <label for="temperature">Temperature</label>
          <input id="temperature" type="number" min="0" max="2" step="0.1" />
        </div>

        <div class="field full model-field">
          <label for="systemPrompt">系统提示词</label>
          <textarea id="systemPrompt"></textarea>
        </div>
      </div>

      <div class="actions">
        <button id="saveSettings" type="button">保存设置</button>
        <button class="ghost" id="testSettings" type="button">测试连接</button>
        <button class="ghost" id="resetSettings" type="button">恢复默认</button>
        <div class="status" id="status"></div>
      </div>
    </section>
  </main>

  <script src="options.js"></script>
</body>
</html>
