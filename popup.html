<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dzc's translator</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #151515;
      --muted: #6f6a61;
      --line: rgba(21, 21, 21, 0.12);
      --panel: rgba(255, 255, 255, 0.72);
      --dark: #151515;
      --accent: #e85d3f;
      --green: #6f9f73;
      --shadow: 0 18px 48px rgba(31, 27, 20, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 360px;
      margin: 0;
      color: var(--ink);
      font-family:
        Geist,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background:
        radial-gradient(circle at 8% 0%, rgba(232, 93, 63, 0.22), transparent 34%),
        radial-gradient(circle at 100% 12%, rgba(111, 159, 115, 0.24), transparent 30%),
        linear-gradient(135deg, #f8f5ee, var(--bg));
      overflow: hidden;
    }

    .shell {
      position: relative;
      min-height: 520px;
      padding: 18px;
    }

    .grain {
      pointer-events: none;
      position: absolute;
      inset: 0;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(21, 21, 21, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(21, 21, 21, 0.035) 1px, transparent 1px);
      background-size: 18px 18px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }

    .topbar {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .mark {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background:
        linear-gradient(135deg, var(--ink), #3a352e);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
    }

    .status {
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--green);
      background: rgba(255, 255, 255, 0.56);
      font-size: 12px;
      font-weight: 700;
    }

    .hero {
      position: relative;
      z-index: 1;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      max-width: 310px;
      font-size: 28px;
      line-height: 0.96;
      letter-spacing: 0;
      font-weight: 800;
    }

    .inline-lens {
      display: inline-block;
      width: 56px;
      height: 22px;
      margin: 0 4px;
      border-radius: 999px;
      vertical-align: middle;
      background:
        linear-gradient(135deg, rgba(232, 93, 63, 0.85), rgba(21, 21, 21, 0.9)),
        url("https://picsum.photos/seed/language-texture/200/80");
      background-size: cover;
      filter: contrast(115%) saturate(85%);
    }

    .subcopy {
      max-width: 300px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .panel {
      position: relative;
      z-index: 1;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    select {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.72);
      font-size: 14px;
      font-weight: 700;
      outline: none;
    }

    .mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .mode-option {
      display: block;
    }

    .mode-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .mode-option span {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.62);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .mode-option input:checked + span {
      color: #fff;
      background: var(--dark);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    button {
      height: 42px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        background 180ms ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary {
      grid-column: span 2;
      color: #fff;
      background: var(--dark);
      box-shadow: 0 14px 26px rgba(21, 21, 21, 0.24);
    }

    .secondary {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--line);
    }

    .secondary:hover {
      background: #fff;
    }

    .result {
      min-height: 86px;
      max-height: 140px;
      padding: 12px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: #25221e;
      background: rgba(255, 255, 255, 0.64);
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .tools {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .tool {
      min-height: 62px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.5);
      transition: transform 180ms ease, background 180ms ease;
    }

    .tool:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.76);
    }

    .tool strong {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
    }

    .tool span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .footer {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      color: var(--muted);
      font-size: 11px;
    }

    .link-button {
      height: auto;
      padding: 0;
      border-radius: 0;
      color: var(--ink);
      background: transparent;
      font-size: 11px;
      font-weight: 800;
    }

    .is-loading {
      opacity: 0.72;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="grain"></div>

    <header class="topbar">
      <div class="brand">
        <div class="mark"></div>
        <span>dzc's translator</span>
      </div>
      <div class="status" id="status">Ready</div>
    </header>

    <section class="hero">
      <h1>
        Translate any
        <span class="inline-lens"></span>
        page text.
      </h1>
      <p class="subcopy">
        选择网页文字，翻译成目标语言。也可以快速处理当前页面的主要文本。
      </p>
    </section>

    <section class="panel">
      <div class="field">
        <label for="sourceLang">源语言</label>
        <select id="sourceLang">
          <option value="en">English</option>
          <option value="zh-CN">中文</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
        </select>
      </div>

      <div class="field">
        <label for="targetLang">目标语言</label>
        <select id="targetLang">
          <option value="zh-CN">中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
        </select>
      </div>

      <div class="field">
        <label>整页模式</label>
        <div class="mode-toggle">
          <label class="mode-option">
            <input type="radio" name="pageMode" value="replace" checked />
            <span>替换翻译</span>
          </label>
          <label class="mode-option">
            <input type="radio" name="pageMode" value="compare" />
            <span>对照翻译</span>
          </label>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="translateSelection">翻译选中文字</button>
        <button class="secondary" id="translatePage">翻译当前页面</button>
        <button class="secondary" id="copyResult">复制译文</button>
      </div>

      <div class="result" id="result">译文会显示在这里。</div>
    </section>

    <section class="tools">
      <div class="tool">
        <strong>划词翻译</strong>
        <span>适合句子、段落、网页说明文字。</span>
      </div>
      <div class="tool">
        <strong>整页处理</strong>
        <span>优先翻译页面中可见的主要文本。</span>
      </div>
      <div class="tool">
        <strong>免费接口</strong>
        <span>默认可接入 MyMemory API。</span>
      </div>
      <div class="tool">
        <strong>后续升级</strong>
        <span>可加入右键菜单、缓存和 API Key。</span>
      </div>
    </section>

    <footer class="footer">
      <span id="apiInfo">MyMemory API</span>
      <button class="link-button" id="openOptions">设置</button>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
